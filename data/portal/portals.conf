# Which backend serves each portal. This file wins over the desktop's own
# list in /usr/share/xdg-desktop-portal, so it repeats that list's lines.
# Every Raye line ends with kde: if the Raye dialogs are not there, the
# desktop's own are used.
#
# When the screen sharing backend is installed, its kde-portals.conf in this
# same folder is read first and carries these two lines too.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.Settings=kde;gtk
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.FileChooser=raye-files;kde
org.freedesktop.impl.portal.AppChooser=raye-files;kde
